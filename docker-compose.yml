version: '3'

services:
  db:
    container_name: postgres_database
    image: postgres:15.1
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=123456

  pgAdmin:
    depends_on:
      - db
    image: dpage/pgadmin4:6.17
    user: "5050:5050"
    ports:
      - "9090:80"
    volumes:
      - ./pgAdmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_PASSWORD=123456 
      - PGADMIN_DEFAULT_EMAIL=superman@google.com 

  frontend:
    image: nginx:alpine
    container_name: inventario_verduras_frontend
    volumes:
      - /var/jenkins_home/workspace/Proyecto/frontend:/usr/share/nginx/html:ro
    ports:
      - "8081:80"

